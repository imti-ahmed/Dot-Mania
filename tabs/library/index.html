<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dot Mania</title>
</head>
<body style="margin:0;background:#0e0e0e">
<!--
  Entry page for /tabs/library. It loads the normal app (../../index.html) unchanged; the app reads the address
  to open this page. There is only one copy of the app. Needs the app served over http.
-->
<script>
  fetch('../../index.html', { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (html) {
    html = html.replace('<head>', '<head><base href="../../">');
    document.open();
    document.write(html);
    document.close();
  }).catch(function () {
    document.body.textContent = 'Open this page from a local server.';
  });
</script>
</body>
</html>
