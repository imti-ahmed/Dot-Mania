<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" width="42" height="42">
  <!-- Same mark as the logo at the top left of the app: red rounded square with the 3x3 dots -->
  <defs>
    <clipPath id="sq"><rect width="42" height="42" rx="10"/></clipPath>
    <radialGradient id="red" gradientUnits="userSpaceOnUse" cx="21" cy="19.32" r="30.9">
      <stop offset="0" stop-color="#f5343a"/>
      <stop offset=".5" stop-color="#ef282d"/>
      <stop offset="1" stop-color="#d61d23"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="16.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".13"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="42" height="42" fill="url(#red)"/>
    <rect width="42" height="16.8" fill="url(#shine)"/>
  </g>
  <g fill="#fff">
    <circle cx="14" cy="14" r="2.4"/><circle cx="21" cy="14" r="2.4" opacity=".55"/><circle cx="28" cy="14" r="2.4"/>
    <circle cx="14" cy="21" r="2.4" opacity=".55"/><circle cx="21" cy="21" r="3.4"/><circle cx="28" cy="21" r="2.4" opacity=".55"/>
    <circle cx="14" cy="28" r="2.4"/><circle cx="21" cy="28" r="2.4" opacity=".55"/><circle cx="28" cy="28" r="2.4"/>
  </g>
</svg>
